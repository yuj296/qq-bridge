# qq-bridge bundle patch
#
# 用途：当 qq-bridge 作为**标准 DSH 插件包**被安装（package.json 里的
# `dsh.bundle.patch` 指向本文件）时，把它的插件行插进 profile 层。
# 行的 name 用**包内子路径 specifier**（`qq-bridge/plugins/...`，见 package.json
# 的 exports 映射），不写绝对路径，换机器也能用。

# bundle 宿主行：加载 lib/index.js（零依赖，只在启动时检查 config.json 并给提示）
- insert:
    - id: qq-bridge-host
      name: 'qq-bridge'

# DSH 设置页「QQ 机器人」分区（140 个字段，host + client 两个半侧都在子包里）
- insert:
    - id: qq-mode-console
      name: 'qq-bridge/plugins/qq-mode-console'
      config: {}

# 侧边栏「唤醒」按键（拉起 SnowLuma + 桥接进程 + 给主人发一句「睡醒了」）
- insert:
    - id: qq-wake
      name: 'qq-bridge/plugins/qq-wake'
      config: {}

# 注意：三个 MCP server（mcp-snowluma-safe / mcp-host-server / mcp-web-search-safe）
# **不在本文件里**。它们的行需要「启动桥接的那台机器上的 node 绝对路径 + 脚本绝对路径」，
# 用包内相对路径写不出来（DSH 的 patch 目前没有可用的相对命令约定）。
# 它们由 `node scripts/setup-dsh.mjs` 写进 profile 的 cordis.patch.yml ——
# 那份脚本同时负责把 preset 复制到 <DSH_HOME>\.agent-presets\。
# 也就是说：本文件描述的是「包自身的 UI 插件」，机器相关的接线仍归安装脚本，
# 这也是本地（file:// 挂载）与将来（市场安装）两种方式的唯一差别。
